<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Pulse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard" aria-labelledby="dashboard-title">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">Portfolio overview</p>
          <h1 id="dashboard-title">Project Pulse</h1>
        </div>
      </header>

      <section id="project-list" class="project-grid" aria-live="polite"></section>
    </main>

    <script>
      async function loadProjects() {
        const response = await fetch('project-data.json');
        const data = await response.json();
        const list = document.getElementById('project-list');

        data.projects.forEach((project) => {
          const card = document.createElement('article');
          card.className = 'project-card';

          const statusClass = project.status.toLowerCase().replace(/\s+/g, '-');

          card.innerHTML = `
            <div class="project-card-header">
              <div>
                <p class="project-owner">${project.owner}</p>
                <h2>${project.name}</h2>
              </div>
              <span class="status-badge ${statusClass}">${project.status}</span>
            </div>
            <p class="project-summary">${project.recentActivity}</p>
            <div class="project-meta">
              <span class="label">Priority</span>
              <span class="priority-pill">${project.priority}</span>
            </div>
          `;

          list.appendChild(card);
        });
      }

      loadProjects();
    </script>
  </body>
</html>
